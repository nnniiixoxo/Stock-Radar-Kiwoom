<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#071525"
  >

  <title>Stock Radar Kiwoom</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #06111f;
      --panel: #0d2134;
      --line: #1d3b53;
      --text: #ecf6ff;
      --muted: #8fb0c8;
      --cyan: #2ce0d0;
      --red: #ff6b7a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(
          circle at top,
          #0b2941,
          var(--bg) 45%
        );
      font-family:
        system-ui,
        -apple-system,
        "Noto Sans KR",
        sans-serif;
    }

    main {
      max-width: 1180px;
      margin: auto;
      padding: 30px 18px;
    }

    header,
    .status,
    .section-title,
    .row,
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    header {
      margin-bottom: 14px;
    }

    .brand-small {
      color: var(--cyan);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 4px 0 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    h1 span {
      color: var(--cyan);
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 12px 16px;
      color: #03201f;
      background: var(--cyan);
      font-weight: 900;
      cursor: pointer;
    }

    .status,
    .note,
    .card {
      background: rgba(13, 33, 52, 0.92);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .status {
      margin-bottom: 12px;
      padding: 13px 16px;
      font-size: 0.9rem;
    }

    .status .ok {
      color: var(--cyan);
    }

    .status .warn {
      color: var(--red);
    }

    #updated,
    .note p,
    footer {
      color: var(--muted);
    }

    .note {
      margin-bottom: 18px;
      padding: 14px 16px;
    }

    .note h2 {
      margin: 0 0 4px;
      font-size: 1.15rem;
    }

    .note p {
      margin: 0;
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .section-title h2 {
      margin: 9px 0;
      font-size: 1.3rem;
    }

    .cards {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      display: block;
      min-width: 0;
      padding: 13px;
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      cursor: pointer;
      transition:
        transform 0.16s ease,
        border-color 0.16s ease,
        box-shadow 0.16s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--cyan);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .card:active {
      transform: scale(0.98);
    }

    .card small {
      color: var(--cyan);
      font-size: 0.72rem;
      font-weight: 900;
    }

    .stock-code {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .card h3 {
      min-height: 2.6em;
      margin: 5px 0 0;
      font-size: 1rem;
      line-height: 1.3;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .score {
      margin: 5px 0;
      color: var(--cyan);
      font-size: 1.45rem;
      font-weight: 900;
    }

    .row {
      margin-top: 6px;
      padding-top: 6px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 0.8rem;
    }

    .row b {
      color: #a9d8f7;
    }

    .naver-link {
      margin-top: 9px;
      padding-top: 8px;
      color: var(--cyan);
      border-top: 1px solid var(--line);
      font-size: 0.75rem;
      font-weight: 900;
      text-align: right;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 36px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 14px;
      text-align: center;
    }

    footer {
      padding: 25px 0;
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 850px) {
      .cards {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      main {
        padding: 16px 9px;
      }

      header {
        align-items: stretch;
        flex-direction: column;
      }

      h1 {
        font-size: 2.05rem;
      }

      header button {
        width: 100%;
        padding: 11px;
      }

      .status {
        padding: 10px;
        font-size: 0.73rem;
      }

      #updated {
        font-size: 0.68rem;
        text-align: right;
      }

      .note {
        margin-bottom: 11px;
        padding: 10px;
      }

      .note h2 {
        font-size: 0.93rem;
      }

      .note p {
        font-size: 0.7rem;
      }

      .section-title h2 {
        font-size: 1.05rem;
      }

      #count {
        font-size: 0.78rem;
      }

      .cards {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      .card {
        padding: 9px;
        border-radius: 11px;
      }

      .card h3 {
        min-height: 2.6em;
        font-size: 0.84rem;
      }

      .card small,
      .stock-code {
        font-size: 0.65rem;
      }

      .score {
        font-size: 1.17rem;
      }

      .row {
        gap: 4px;
        margin-top: 5px;
        padding-top: 5px;
        font-size: 0.68rem;
      }

      .naver-link {
        margin-top: 7px;
        padding-top: 6px;
        font-size: 0.65rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <div class="brand-small">
          KOREA PRE-MARKET RADAR
        </div>

        <h1>
          Stock Radar
          <span>Kiwoom</span>
        </h1>
      </div>

      <button
        id="calculate"
        type="button"
      >
        현재 기준 다시 계산
      </button>
    </header>

    <section class="status">
      <b id="status">최신 결과 불러오는 중</b>
      <span id="updated"></span>
    </section>

    <section class="note">
      <h2>
        07:00 프리마켓 → 08:30 최종 신호
      </h2>

      <p>
        예상체결 등락·거래량, 호가 불균형,
        체결강도, 거래대금, 외국인·기관 흐름을
        점수화합니다.
      </p>
    </section>

    <section>
      <div class="section-title">
        <h2>오늘의 후보</h2>
        <span id="count">0종목</span>
      </div>

      <div
        id="cards"
        class="cards"
      ></div>
    </section>

    <footer>
      정보 제공용 · 수익 보장 없음 · 자동주문 기능 없음
    </footer>
  </main>

  <script>
    const WORKFLOW_URL =
      "https://github.com/nnniiixoxo/Stock-Radar-Kiwoom/actions/workflows/market-screen.yml";

    function getElement(id) {
      return document.getElementById(id);
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("ko-KR").format(
        Number(value || 0)
      );
    }

    function stockCode(value) {
      const match = String(value || "").match(/\d{6}/);
      return match ? match[0] : "";
    }

    function naverUrl(value) {
      const code = stockCode(value);

      if (!code) {
        return "https://finance.naver.com/";
      }

      return (
        "https://finance.naver.com/item/main.naver?code="
        + code
      );
    }

    function displayValue(value) {
      if (
        value === undefined ||
        value === null ||
        value === ""
      ) {
        return "0";
      }

      return value;
    }

    function makeCard(stock, index) {
      const code = stockCode(stock.code);
      const name = stock.name || code;

      return `
        <a
          class="card"
          href="${naverUrl(stock.code)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="card-top">
            <small>#${index + 1}</small>
            <span class="stock-code">${code}</span>
          </div>

          <h3>${name}</h3>

          <div class="score">
            ${displayValue(stock.score)}점
          </div>

          <div class="row">
            <span>등락</span>
            <b>${displayValue(stock.change_pct)}%</b>
          </div>

          <div class="row">
            <span>체결량</span>
            <b>${formatNumber(stock.expected_volume)}</b>
          </div>

          <div class="row">
            <span>잔량비</span>
            <b>${displayValue(stock.bid_ask_ratio)}</b>
          </div>

          <div class="row">
            <span>체결강도</span>
            <b>${displayValue(
              stock.execution_strength
            )}</b>
          </div>

          <div class="naver-link">
            네이버 증권 ↗
          </div>
        </a>
      `;
    }

    async function loadStocks() {
      const status = getElement("status");
      const cards = getElement("cards");

      try {
        status.textContent = "최신 결과 불러오는 중";
        status.className = "";

        const response = await fetch(
          "data/results.json?t=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "데이터 응답 오류 " + response.status
          );
        }

        const data = await response.json();

        const stocks = Array.isArray(data.stocks)
          ? data.stocks
          : [];

        status.textContent =
          data.status === "ok"
            ? "정상 업데이트"
            : data.message || "확인 필요";

        status.className =
          data.status === "ok"
            ? "ok"
            : "warn";

        getElement("updated").textContent =
          data.generated_at
            ? new Date(
                data.generated_at
              ).toLocaleString("ko-KR")
            : "";

        getElement("count").textContent =
          stocks.length + "종목";

        if (stocks.length > 0) {
          cards.innerHTML = stocks
            .map(makeCard)
            .join("");
        } else {
          cards.innerHTML = `
            <div class="empty">
              ${
                data.message ||
                "조건을 통과한 종목이 없습니다."
              }
            </div>
          `;
        }
      } catch (error) {
        status.textContent =
          "데이터를 불러오지 못했습니다: "
          + error.message;

        status.className = "warn";

        cards.innerHTML = `
          <div class="empty">
            페이지를 새로고침해 주세요.
          </div>
        `;
      }
    }

    getElement("calculate").addEventListener(
      "click",
      function () {
        const opened = window.open(
          WORKFLOW_URL,
          "_blank"
        );

        if (!opened) {
          window.location.href = WORKFLOW_URL;
        }
      }
    );

    window.addEventListener(
      "focus",
      function () {
        setTimeout(loadStocks, 1000);
      }
    );

    setInterval(loadStocks, 30000);

    loadStocks();
  </script>
</body>
</html>
