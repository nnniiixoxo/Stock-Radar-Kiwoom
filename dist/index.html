<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#071525"
  >

  <title>Stock Radar Kiwoom</title>

  <style>
    :root {
      --background: #061423;
      --background-light: #0a2033;
      --card: #0c2235;
      --card-hover: #102a40;
      --border: #1c425d;
      --border-light: #28516b;

      --text: #f1f7ff;
      --subtext: #8fcaf1;
      --muted: #70a8ce;

      --accent: #28d8cf;
      --positive: #ff4358;
      --negative: #3999ff;
      --neutral: #3999ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        "Segoe UI",
        sans-serif;
    }

    button,
    a {
      font-family: inherit;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .brand-small {
      display: block;
      margin-bottom: 12px;
      color: var(--accent);

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.8px;
    }

    h1 {
      margin: 0;
      color: var(--text);

      font-size: clamp(40px, 5.5vw, 66px);
      font-weight: 750;
      line-height: 1;
      letter-spacing: -2px;
    }

    h1 span {
      color: var(--accent);
    }

    #refresh {
      flex: 0 0 auto;
      border: 0;
      border-radius: 14px;
      padding: 14px 19px;

      background: var(--accent);
      color: #06202a;

      font-size: 14px;
      font-weight: 800;
      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    #refresh:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    #refresh:active {
      transform: translateY(0);
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

      min-height: 48px;
      margin-bottom: 12px;
      padding: 12px 16px;

      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
    }

    #status {
      color: var(--accent);
      font-size: 15px;
      font-weight: 750;
    }

    #updated {
      color: var(--subtext);
      font-size: 13px;
      text-align: right;
    }

    .note {
      margin-bottom: 26px;
      padding: 16px;

      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
    }

    .note h2 {
      margin: 0 0 5px;

      color: var(--text);
      font-size: 20px;
      line-height: 1.3;
    }

    .note p {
      margin: 0;

      color: var(--subtext);
      font-size: 13px;
      line-height: 1.55;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 10px;
    }

    .section-title h2 {
      margin: 0;

      color: var(--text);
      font-size: 24px;
      letter-spacing: -0.5px;
    }

    #count {
      color: var(--text);
      font-size: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .stock-card {
      display: block;
      min-width: 0;
      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--card);
      color: var(--text);
      text-decoration: none;

      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .stock-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      margin-bottom: 7px;
    }

    .rank {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    .code {
      color: var(--subtext);
      font-size: 11px;
    }

    .stock-name {
      min-height: 42px;
      margin: 0 0 8px;

      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.3;

      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .score {
      margin-bottom: 7px;

      color: var(--accent);
      font-size: 20px;
      font-weight: 850;
      line-height: 1.2;
    }

    .data-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      min-height: 31px;
      padding: 6px 0;

      border-top: 1px solid var(--border);
    }

    .data-label {
      color: var(--subtext);
      font-size: 13px;
      white-space: nowrap;
    }

    .data-value {
      color: var(--text);
      font-size: 13px;
      font-weight: 750;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .data-value.change {
      font-size: 16px;
      font-weight: 850;
    }

    .positive {
      color: var(--positive);
    }

    .negative,
    .zero {
      color: var(--negative);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 45px 20px;

      border: 1px dashed var(--border-light);
      border-radius: 15px;

      color: var(--subtext);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .error-message {
      grid-column: 1 / -1;
      padding: 35px 20px;

      border: 1px solid #7c3340;
      border-radius: 15px;
      background: #281522;

      color: #ff9bab;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    footer {
      padding: 25px 0 0;

      color: var(--subtext);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 1180px);
        padding: 18px 0 35px;
      }

      header {
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .brand-small {
        margin-bottom: 8px;
        font-size: 9px;
        letter-spacing: 1.2px;
      }

      h1 {
        font-size: clamp(29px, 9.2vw, 42px);
        letter-spacing: -1.5px;
      }

      #refresh {
        max-width: 110px;
        padding: 11px 12px;
        border-radius: 12px;

        font-size: 11px;
        line-height: 1.3;
      }

      .status {
        min-height: 44px;
        margin-bottom: 10px;
        padding: 10px 12px;
      }

      #status {
        font-size: 12px;
      }

      #updated {
        max-width: 52%;
        font-size: 10px;
        line-height: 1.35;
      }

      .note {
        margin-bottom: 20px;
        padding: 12px;
      }

      .note h2 {
        font-size: 15px;
      }

      .note p {
        margin-top: 4px;
        font-size: 10px;
        line-height: 1.45;
      }

      .section-title {
        margin-bottom: 8px;
      }

      .section-title h2 {
        font-size: 20px;
      }

      #count {
        font-size: 12px;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .stock-card {
        padding: 10px;
        border-radius: 13px;
      }

      .card-top {
        margin-bottom: 5px;
      }

      .rank {
        font-size: 10px;
      }

      .code {
        font-size: 9px;
      }

      .stock-name {
        min-height: 36px;
        margin-bottom: 6px;

        font-size: 13px;
        line-height: 1.3;
      }

      .score {
        margin-bottom: 5px;
        font-size: 17px;
      }

      .data-row {
        min-height: 27px;
        padding: 5px 0;
      }

      .data-label {
        font-size: 10px;
      }

      .data-value {
        font-size: 10px;
      }

      .data-value.change {
        font-size: 13px;
      }

      footer {
        padding-top: 20px;
        font-size: 10px;
      }
    }

    @media (max-width: 350px) {
      main {
        width: min(100% - 14px, 1180px);
      }

      .stock-card {
        padding: 8px;
      }

      .stock-name {
        font-size: 12px;
      }

      .data-label,
      .data-value {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <span class="brand-small">
          KOREA PRE-MARKET RADAR
        </span>

        <h1>
          Stock Radar
          <span>Kiwoom</span>
        </h1>
      </div>

      <button
        id="refresh"
        type="button"
      >
        현재 기준 다시 계산
      </button>
    </header>

    <section class="status">
      <b id="status">
        결과 불러오는 중
      </b>

      <span id="updated"></span>
    </section>

    <section class="note">
      <h2>
        07:00 프리마켓 → 08:30 최종 신호
      </h2>

      <p>
        정배열, RSI 반전, 20일선 이격도 회복,
        거래대금 증가와 장전 수급을 종합해 점수화합니다.
      </p>
    </section>

    <section>
      <div class="section-title">
        <h2>오늘의 후보</h2>
        <span id="count">0종목</span>
      </div>

      <div
        id="cards"
        class="cards"
      ></div>
    </section>

    <footer>
      정보 제공용 · 수익 보장 없음 · 자동주문 기능 없음
    </footer>
  </main>

  <script>
    const WORKFLOW_URL =
      "https://github.com/nnniiixoxo/Stock-Radar-Kiwoom/actions/workflows/market-screen.yml";

    const RESULT_URL =
      `./data/results.json?t=${Date.now()}`;

    const refreshButton =
      document.getElementById("refresh");

    const statusElement =
      document.getElementById("status");

    const updatedElement =
      document.getElementById("updated");

    const countElement =
      document.getElementById("count");

    const cardsElement =
      document.getElementById("cards");


    function firstValue(...values) {
      return values.find(
        value =>
          value !== undefined &&
          value !== null &&
          value !== ""
      );
    }


    function toNumber(value) {
      if (
        value === undefined ||
        value === null ||
        value === ""
      ) {
        return 0;
      }

      const cleaned = String(value)
        .replace(/,/g, "")
        .replace(/[^0-9.+-]/g, "");

      const result = Number(cleaned);

      return Number.isFinite(result)
        ? result
        : 0;
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function extractCode(stock) {
      const rawCode = String(
        firstValue(
          stock.code,
          stock.stk_cd,
          stock.종목코드,
          ""
        )
      );

      const match = rawCode.match(/\d{6}/);

      return match ? match[0] : "";
    }


    function getStockName(stock) {
      return firstValue(
        stock.name,
        stock.stk_nm,
        stock.종목명,
        "종목명 없음"
      );
    }


    function getChange(stock) {
      return toNumber(
        firstValue(
          stock.change_pct,
          stock.change,
          stock.등락,
          stock.등락률,
          stock.예상등락,
          0
        )
      );
    }


    function getVolume(stock) {
      return toNumber(
        firstValue(
          stock.expected_volume,
          stock.volume,
          stock.체결량,
          stock.예상체결량,
          0
        )
      );
    }


    function getRatio(stock) {
      return toNumber(
        firstValue(
          stock.bid_ask_ratio,
          stock.ratio,
          stock.잔량비,
          stock.호가잔량비교,
          0
        )
      );
    }


    function getScore(stock) {
      return toNumber(
        firstValue(
          stock.score,
          stock.점수,
          0
        )
      );
    }


    function numberClass(value) {
      if (value > 0) {
        return "positive";
      }

      if (value < 0) {
        return "negative";
      }

      return "zero";
    }


    function formatNumber(value) {
      return Math.round(value).toLocaleString("ko-KR");
    }


    function formatRatio(value) {
      return value.toLocaleString(
        "ko-KR",
        {
          maximumFractionDigits: 2
        }
      );
    }


    function formatScore(value) {
      return value.toLocaleString(
        "ko-KR",
        {
          maximumFractionDigits: 1
        }
      );
    }


    function formatDate(value) {
      if (!value) {
        return "";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleString(
        "ko-KR",
        {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "numeric",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit"
        }
      );
    }


    function createStockCard(stock, index) {
      const code = extractCode(stock);
      const name = getStockName(stock);

      const score = getScore(stock);
      const change = getChange(stock);
      const volume = getVolume(stock);
      const ratio = getRatio(stock);

      const card = document.createElement("a");

      card.className = "stock-card";

      if (code) {
        card.href =
          `https://m.stock.naver.com/domestic/stock/${code}/total`;

        card.target = "_blank";
        card.rel = "noopener noreferrer";
      } else {
        card.href = "#";

        card.addEventListener(
          "click",
          event => event.preventDefault()
        );
      }

      card.setAttribute(
        "aria-label",
        `${name} 네이버페이 증권 종목 페이지 열기`
      );

      card.innerHTML = `
        <div class="card-top">
          <span class="rank">
            #${index + 1}
          </span>

          <span class="code">
            ${escapeHtml(code)}
          </span>
        </div>

        <h3 class="stock-name">
          ${escapeHtml(name)}
        </h3>

        <div class="score">
          ${formatScore(score)}점
        </div>

        <div class="data-row">
          <span class="data-label">
            예상등락
          </span>

          <span
            class="data-value change ${numberClass(change)}"
          >
            ${change > 0 ? "+" : ""}${formatRatio(change)}%
          </span>
        </div>

        <div class="data-row">
          <span class="data-label">
            체결량
          </span>

          <span
            class="data-value ${numberClass(volume)}"
          >
            ${formatNumber(volume)}
          </span>
        </div>

        <div class="data-row">
          <span class="data-label">
            잔량비
          </span>

          <span
            class="data-value ${numberClass(ratio)}"
          >
            ${formatRatio(ratio)}
          </span>
        </div>
      `;

      return card;
    }


    function showEmpty(message) {
      cardsElement.innerHTML = "";

      const empty = document.createElement("div");

      empty.className = "empty";
      empty.textContent = message;

      cardsElement.appendChild(empty);
      countElement.textContent = "0종목";
    }


    function showError(message) {
      cardsElement.innerHTML = "";

      const error = document.createElement("div");

      error.className = "error-message";
      error.textContent = message;

      cardsElement.appendChild(error);
      countElement.textContent = "0종목";
    }


    async function loadResults() {
      statusElement.textContent =
        "최신 결과 확인 중";

      updatedElement.textContent = "";

      try {
        const response = await fetch(
          RESULT_URL,
          {
            cache: "no-store",
            headers: {
              "Cache-Control": "no-cache"
            }
          }
        );

        if (!response.ok) {
          throw new Error(
            `결과 파일을 불러오지 못했습니다. HTTP ${response.status}`
          );
        }

        const data = await response.json();

        const stocks = firstValue(
          data.stocks,
          data.주식,
          data.results,
          []
        );

        const stockList = Array.isArray(stocks)
          ? stocks
          : [];

        const generatedAt = firstValue(
          data.generated_at,
          data.생성시간,
          data.updated_at,
          ""
        );

        const status = firstValue(
          data.status,
          data.상태,
          ""
        );

        const message = firstValue(
          data.message,
          data.메시지,
          ""
        );

        cardsElement.innerHTML = "";

        if (status === "ok" || stockList.length > 0) {
          statusElement.textContent =
            "정상 업데이트";
        } else {
          statusElement.textContent =
            message || "결과 없음";
        }

        updatedElement.textContent =
          formatDate(generatedAt);

        countElement.textContent =
          `${stockList.length}종목`;

        if (stockList.length === 0) {
          showEmpty(
            message ||
            "현재 기준을 통과한 종목이 없습니다."
          );

          return;
        }

        stockList.forEach(
          (stock, index) => {
            cardsElement.appendChild(
              createStockCard(stock, index)
            );
          }
        );

      } catch (error) {
        console.error(error);

        statusElement.textContent =
          "결과 불러오기 실패";

        showError(
          "최신 결과를 불러오지 못했습니다. " +
          "잠시 후 페이지를 새로고침해 주세요."
        );
      }
    }


    refreshButton.addEventListener(
      "click",
      () => {
        window.open(
          WORKFLOW_URL,
          "_blank",
          "noopener,noreferrer"
        );
      }
    );


    loadResults();
  </script>
</body>
</html>
